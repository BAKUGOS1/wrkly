[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "echo '=== Running Prisma DB Push ===' && ./node_modules/.bin/prisma db push --schema=./prisma/schema.prisma --accept-data-loss --skip-generate && echo '=== DB Push Complete ===' && node dist/server.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

[environments.production.deploy]
numReplicas = 1
