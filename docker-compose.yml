services:
  postgres:
    image: postgres:16-alpine
    container_name: wrkly-db
    environment:
      POSTGRES_DB: wrkly
      POSTGRES_USER: wrkly
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - wrkly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrkly -d wrkly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wrkly-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - wrkly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wrkly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@wrkly.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - wrkly-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  wrkly-network:
    driver: bridge

volumes:
  pgdata:
