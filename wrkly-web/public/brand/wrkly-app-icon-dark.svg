    <line x1="12" y1="24" x2="28" y2="32" stroke="#4F7DF7" stroke-width="1" opacity="0.18"/>
    <line x1="44" y1="24" x2="28" y2="32" stroke="#6366F1" stroke-width="1" opacity="0.12"/>
    <line x1="44" y1="24" x2="60" y2="32" stroke="#7C5BF0" stroke-width="1" opacity="0.12"/>
