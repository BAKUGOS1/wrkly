  </defs>
  <rect width="120" height="120" rx="26" fill="#0B0F1A"/>
  <g transform="translate(16, 26)">
    <!-- Row 1 -->
    <rect x="0"  y="0" width="24" height="24" rx="6" fill="url(#d_blue)"/>
    <rect x="0"  y="0" width="24" height="12" rx="6" fill="white" opacity="0.08"/>
    <rect x="32" y="0" width="24" height="24" rx="6" fill="url(#d_mid)"/>
    <rect x="32" y="0" width="24" height="12" rx="6" fill="white" opacity="0.08"/>
    <rect x="64" y="0" width="24" height="24" rx="6" fill="url(#d_violet)"/>
    <rect x="64" y="0" width="24" height="12" rx="6" fill="white" opacity="0.08"/>
    <!-- Row 2 -->
    <rect x="16" y="32" width="24" height="24" rx="6" fill="url(#d_blue)" opacity="0.6"/>
    <rect x="16" y="32" width="24" height="12" rx="6" fill="white" opacity="0.05"/>
    <rect x="48" y="32" width="24" height="24" rx="6" fill="url(#d_violet)" opacity="0.6"/>
